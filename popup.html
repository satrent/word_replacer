<!DOCTYPE html>
<html>
<head>
  <title>Word Replacer</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: sans-serif;
    }
    .input-group {
      margin-bottom: 10px;
      display: flex;
      gap: 5px;
    }
    input {
      flex: 1;
      padding: 5px;
    }
    button {
      padding: 5px 10px;
      cursor: pointer;
    }
    #replacements-list {
      margin-top: 10px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    .replacement-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      background: #f9f9f9;
      padding: 5px;
      border-radius: 4px;
    }
    .replacement-text {
      font-size: 14px;
    }
    .remove-btn {
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <h3>Word Replacer</h3>
  
  <div class="input-group">
    <input type="text" id="target" placeholder="Target Word" />
    <input type="text" id="replacement" placeholder="Replacement" />
  </div>
  <button id="add-btn">Add Replacement</button>

  <div id="replacements-list">
    <!-- List items will go here -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
